name: Dozer
options:
  usesTabs: false
  tabWidth: 4
  createIntermediateGroups: true
packages:
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    from: 9.0.9
  Settings:
    url: https://github.com/sindresorhus/Settings
    from: 3.1.1
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: 1.1.0
  MASShortcut:
    # No tagged release includes Package.swift (added after 2.4.0), so pin the commit.
    url: https://github.com/shpakovski/MASShortcut
    revision: 6f2603c6b6cc18f64a799e5d2c9d3bbc467c413a
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
targets:
  Dozer:
    type: application
    platform: macOS
    deploymentTarget:
      macOS: "13.0"
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    sources:
      - Dozer
    preBuildScripts:
      - script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          swiftgen
        name: Generate files using SwiftGen
    postBuildScripts:
      - path: Scripts/Swiftlint.sh
        name: Swiftlint
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Dozer/Other/Dozer.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: "com.mortennn.Dozer"
        SWIFT_VERSION: 5
        DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
        ENABLE_HARDENED_RUNTIME: true
        VERSIONING_SYSTEM: apple-generic
        CURRENT_PROJECT_VERSION: 30
    dependencies:
      - package: LaunchAtLogin
      - package: Defaults
      - package: Settings
      - package: MASShortcut
      - package: Sparkle
schemes:
  Dozer:
    build:
      targets:
        Dozer: all
